# MyST project config. Build: `npx myst start` (live preview) or
# `npx myst build --html` (static site in _build/html).
version: 1
project:
  title: Algorithmic Information Theory
  description: Notes on algorithmic information theory and effective dimension, ported from Raymond Tana's PhD dissertation.
  authors:
    - name: Raymond Tana
  github: https://github.com/RaymondTana/ait-notes
  bibliography:
    - refs.bib
  # Numbers come from each page's place in the toc below: MyST numbers page
  # titles and headings, and tools/numbering.mjs numbers theorem-like blocks
  # and labeled equations (unlabeled equations stay unnumbered).
  plugins:
    - tools/numbering.mjs
  numbering:
    title: true
    headings: true
    equation: false
  # Macros from legacy_tex/UserDefinedCommands.tex, translated to
  # KaTeX. KaTeX cannot take optional arguments, so each macro of the form
  # \Kc[r]{x}{y} gets a twin \KcAt{r}{x}{y}.
  math:
    # \ref{label} in math is replaced by tools/numbering.mjs; this placeholder
    # only keeps MyST's first render from failing.
    '\ref': '\text{??}'
    # symbols
    '\A': '\mathcal{A}'
    '\B': '\mathbb{B}'
    '\C': '\mathcal{C}'
    '\D': '\mathcal{D}'
    '\e': '\epsilon'
    '\F': '\mathbb{F}'
    '\H': '\mathcal{H}'
    '\L': '\mathcal{L}'
    '\M': '\mathcal{M}'
    '\N': '\mathbb{N}'
    '\O': '\mathcal{O}'
    '\P': '\mathfrak{p}'
    '\Q': '\mathbb{Q}'
    '\R': '\mathbb{R}'
    '\w': '\omega'
    '\Z': '\mathbb{Z}'
    '\OR': '\vee'
    '\AND': '\wedge'
    '\bigOR': '\bigvee'
    '\bigAND': '\bigwedge'
    '\NOT': '\lnot'
    '\up': '\uparrow'
    '\down': '\downarrow'
    '\proves': '\vdash'
    '\entails': '\models'
    '\Kappa': '\boldsymbol\kappa'
    # operators
    '\length': '\operatorname{length}'
    '\dom': '\operatorname{dom}'
    '\rng': '\operatorname{rng}'
    '\rank': '\operatorname{rank}'
    '\diam': '\operatorname{diam}'
    '\dim': '\operatorname{dim}'
    '\Dim': '\operatorname{Dim}'
    '\argmin': '\operatorname*{arg\,min}'
    '\argmax': '\operatorname*{arg\,max}'
    # templates
    '\set': '\left\{ {#1} : {#2} \right\}'
    '\seq': '\left\{ {#1} \right\}'
    '\len': '\operatorname{len}\left( {#1} \right)'
    '\abs': '\left|{#1}\right|'
    '\ang': '\left<{#1}\right>'
    '\p': '\left({#1}\right)'
    '\brk': '\left[{#1}\right]'
    # KaTeX has no \left\llbracket; two \left[ pulled together with negative
    # space give double brackets that still resize with their contents.
    '\bbrk': '\left[\!\left[{#1}\right]\!\right]'
    '\restrict': '{#1}\upharpoonright{#2}'
    '\floor': '\left\lfloor{#1}\right\rfloor'
    '\ceil': '\left\lceil{#1}\right\rceil'
    '\norm': '\left|\left| {#1} \right| \right|'
    '\normAt': '\left|\left| {#2} \right| \right|_{#1}'
    '\mdim': '\operatorname{mdim}\left( {#1} : {#2} \right)'
    '\Mdim': '\operatorname{Mdim}\left( {#1} : {#2} \right)'
    # complexity notions: \X{...} and \XAt{subscript}{...}
    '\K': 'K\left({#1}\right)'
    '\KAt': 'K_{#1}\left({#2}\right)'
    '\Kc': 'K\left({#1} \mid {#2}\right)'
    '\KcAt': 'K_{#1}\left({#2} \mid {#3}\right)'
    '\Kcalt': '\mathcal{K}\left({#1} \mid {#2}\right)'
    '\KcaltAt': '\mathcal{K}_{#1}\left({#2} \mid {#3}\right)'
    '\I': 'I\left({#1} : {#2}\right)'
    '\IAt': 'I_{#1}\left({#2} : {#3}\right)'
    '\Ic': 'I\left({#1} : {#2} \mid {#3}\right)'
    '\IcAt': 'I_{#1}\left({#2} : {#3} \mid {#4}\right)'
    '\Icalt': '\mathcal{I}\left({#1} : {#2} \mid {#3}\right)'
    '\IcaltAt': '\mathcal{I}_{#1}\left({#2} : {#3} \mid {#4}\right)'
    '\J': 'J\left({#1} : {#2}\right)'
    '\JAt': 'J_{#1}\left({#2} : {#3}\right)'
    '\Jc': 'J\left({#1} : {#2} \mid {#3}\right)'
    '\JcAt': 'J_{#1}\left({#2} : {#3} \mid {#4}\right)'
    '\Jcalt': '\mathcal{J}\left({#1} : {#2} \mid {#3}\right)'
    '\JcaltAt': '\mathcal{J}_{#1}\left({#2} : {#3} \mid {#4}\right)'
    '\m': '\mathbf{m}\left({#1}\right)'
    '\mAt': '\mathbf{m}_{#1}\left({#2}\right)'
    '\mc': '\mathbf{m}\left({#1} \mid {#2}\right)'
  # Each chapter is a landing page with its sections as children; order here
  # sets all numbering. Keep entries as `- file:` lines (the plugin reads them).
  toc:
    - file: index.md
    - file: notes/introduction/01-introduction.md
    - file: notes/introduction/02-notation.md
    - file: notes/algorithmic_complexity/00-algorithmic-complexity.md
      children:
        - file: notes/algorithmic_complexity/01-measures-and-hausdorff-dimension.md
        - file: notes/algorithmic_complexity/02-computability-theory.md
        - file: notes/algorithmic_complexity/03-prefix-complexity.md
        - file: notes/algorithmic_complexity/04-algorithmic-randomness.md
        - file: notes/algorithmic_complexity/05-semimeasures.md
        - file: notes/algorithmic_complexity/06-complexity-characterizations-of-algorithmic-randomness.md
    - file: notes/complexity_over_reals/00-complexity-over-the-reals.md
      children:
        - file: notes/complexity_over_reals/01-lifting-prefix-complexity-to-reals.md
        - file: notes/complexity_over_reals/02-effective-hausdorff-dimension.md
        - file: notes/complexity_over_reals/03-effective-dimension-variants.md
        - file: notes/complexity_over_reals/04-point-to-set-principles.md
        - file: notes/complexity_over_reals/05-robustness-of-the-lift.md
        - file: notes/complexity_over_reals/06-effective-dimension-under-uniformly-continuous-maps.md
    - file: notes/reasoning/00-reasoning.md
      children:
        - file: notes/reasoning/01-primitives-of-reasoning.md
    - file: notes/glossary.md
site:
  template: book-theme
  analytics_google: "G-ZG5QV893BR"
  options:
    style: assets/custom.css
    logo_text: Raymond Tana
    logo_url: https://raymondtana.github.io/
    folders: true
